<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/public/Css/style.css">
  <title>Products Page</title>
</head>

<body>
  <h1>Products Page</h1>

  <form action="/submit-product" method="POST">  <label for="productName">Product Name:</label><br>
    <input type="text" id="productName" name="productName" required><br><br>  <label for="productDescription">Product Description:</label><br>
    <textarea id="productDescription" name="productDescription" rows="4" cols="50"></textarea><br><br>

    <label for="productPrice">Product Price:</label><br>
    <input type="number" id="productPrice" name="productPrice" min="0" step="0.01" required><br><br>

    <label for="productCategory">Product Category:</label><br>
    <select id="productCategory" name="productCategory">
      <option value="electronics">Electronics</option>
      <option value="clothing">Clothing</option>
      <option value="books">Books</option>
      <option value="other">Other</option>
    </select><br><br>

    <input type="submit" value="Submit">
  </form>

</body>

</html>
